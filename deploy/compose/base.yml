services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SKOPE_BUILD_ID: ${SKOPE_BUILD_ID:-development}
    restart: always
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      titiler:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      RASTER_CONNECT_TIMEOUT_SECONDS: ${RASTER_CONNECT_TIMEOUT_SECONDS:-5}
      RASTER_HTTP_TIMEOUT_SECONDS: ${RASTER_HTTP_TIMEOUT_SECONDS:-15}
      SKOPE_TELEMETRY_ENABLED: ${SKOPE_TELEMETRY_ENABLED:-true}
      SKOPE_TELEMETRY_GET_SAMPLE_RATE: ${SKOPE_TELEMETRY_GET_SAMPLE_RATE:-0.1}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/metadata', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    volumes:
      # The pin's release root (PIN-001); the Makefile resolves it.
      - ${SKOPE_RELEASE_ROOT:?run through make, which reads it from the pin}:/releases:ro
    networks:
      - internal_geospatial_net # Internal network to see Titiler
      - default # External access to reach S3 and serve the frontend
  redis:
    build:
      context: .
      dockerfile: deploy/Dockerfile.redis
    image: openskope/skope-api-redis:latest
    command: redis-server --save "" --appendonly no
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal_geospatial_net

  titiler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.titiler
    image: openskope/skope-api-titiler:latest
    restart: always
    environment:
      SKOPE_TELEMETRY_ENABLED: ${SKOPE_TELEMETRY_ENABLED:-true}
      SKOPE_TELEMETRY_GET_SAMPLE_RATE: ${SKOPE_TELEMETRY_GET_SAMPLE_RATE:-0.1}
      GDAL_HTTP_CONNECTTIMEOUT: ${RASTER_CONNECT_TIMEOUT_SECONDS:-5}
      GDAL_HTTP_TIMEOUT: ${RASTER_HTTP_TIMEOUT_SECONDS:-15}
      GDAL_HTTP_MAX_RETRY: "0"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.ovr
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      AWS_NO_SIGN_REQUEST: YES
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:80/healthz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      # HTTP readiness can lag worker startup on the application host.
      start_period: 120s
    volumes:
      - ${SKOPE_RELEASE_ROOT:?run through make, which reads it from the pin}:/releases:ro
    networks:
      # Titiler is ONLY on the internal network.
      - internal_geospatial_net

  release:
    user: "${SKOPE_OPERATOR_UID:?run through make}:${SKOPE_OPERATOR_GID:?run through make}"
    build:
      context: .
      dockerfile: deploy/Dockerfile.ingest
      target: runtime
    image: openskope/skope-api-ingest:latest
    profiles:
      - ingest
    entrypoint: ["skope-release"]
    environment:
      AWS_NO_SIGN_REQUEST: YES
      # GDAL assumes remote files with other extensions don't exist, so it never
      # probes for sidecars. Each prepare input format needs its extension here.
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff,.nc
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      PRODUCER_REVISION: ${PRODUCER_REVISION:-unknown}
      SKOPE_RELEASE_DATASETS: /ingest/datasets
      SKOPE_RELEASE_SOURCE_MIRROR: /sources
      SKOPE_RELEASE_ROOT: /releases
      SKOPE_RELEASE_AUDIT_ROOT: /audit
      SKOPE_RELEASE_PINS: /ingest/deploy/releases
      HOME: /tmp
    volumes:
      - ./timeseries/ingest/datasets:/ingest/datasets:ro
      - ./deploy:/ingest/deploy:ro
      - ${RELEASE_SOURCE_MIRROR:-./cog-input}:/sources:ro
      - ${RELEASE_ROOT:-./timeseries/ingest/output/releases}:/releases
      - ${RELEASE_AUDIT_ROOT:-./timeseries/ingest/output/audit}:/audit

  ingest-test:
    user: "${SKOPE_OPERATOR_UID:?run through make}:${SKOPE_OPERATOR_GID:?run through make}"
    environment:
      HOME: /tmp
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"
    build:
      context: .
      dockerfile: deploy/Dockerfile.ingest
      target: test
    profiles:
      - test

networks:
  internal_geospatial_net:
    driver: bridge
