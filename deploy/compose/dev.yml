services:
  server:
    user: "${SKOPE_OPERATOR_UID:?run through make}:${SKOPE_OPERATOR_GID:?run through make}"
    environment:
      HOME: /tmp
    build:
      args:
        ENVIRONMENT: dev
        REQUIREMENTS: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--reload"]
    image: openskope/skope-api:dev
    volumes:
      - ./timeseries/app:/code/app
      - ./deploy/settings/dev.yml:/code/config/app_settings.yml:ro
      - ./deploy/releases/dev.yml:/code/config/releases.yml:ro
      - ./deploy/display:/code/config/display:ro
    ports:
      - "127.0.0.1:8001:8000"
