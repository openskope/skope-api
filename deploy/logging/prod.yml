version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s %(levelname)-7s %(name)s:%(funcName)s:%(lineno)d %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: 'logging.StreamHandler'
    level: DEBUG
    formatter: standard
root:
  level: WARNING
  handlers:
  - console
  propagate: false

loggers:
  app:
    level: DEBUG
    handlers:
      - console
    propagate: false
  gunicorn:
    error:
      propagate: true
  uvicorn:
    error:
      propagate: true
