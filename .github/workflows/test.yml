name: Test SKOPE Time Series API

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday at 06:00 America/Phoenix. Scheduled runs use the default branch.
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Re-execute OS/package installation even if upstream tags did not move.
      RUNTIME_REFRESH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests
        run: make test BUILD_FLAGS=--pull
      - name: Test fresh runtime images
        run: make test-runtime
      - name: Scan tested images
        run: make scan-runtime-images
      - name: Archive tested images
        if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: make export-runtime-images
      - name: Retain tested images for deployment and rollback
        if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: runtime-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-images/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Retain vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-images/scan-*.txt
          if-no-files-found: ignore
          retention-days: 14
