- id: lbda_v2
  title: Living Blended Drought Atlas (LBDA) Version 2
  timespan:
    resolution:
      years: 1
    period:
      gte: '0001'
      lte: '2017'
  variables:
    - id: pmdi
      class: Drought
      name: Palmer Modified Drought Index

- id: paleocar_v2
  title: PaleoCAR Version 2
  timespan:
    resolution:
      years: 1
    period:
      gte: '0001'
      lte: '2000'
  variables:
    - id: gdd_may_sept
      class: Temperature
      name: May-September growing degree days
      units: "\xB0F GDD"
    - id: maize_farming_niche
      class: Agriculture
      name: Maize farming niche
    - id: ppt_water_year
      class: Precipitation
      name: Water-year precipitation
      units: mm

