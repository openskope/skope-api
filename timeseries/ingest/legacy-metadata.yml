- id: prism
  title: Parameter-elevation Regressions on Independent Slopes Model
  timespan:
    resolution:
      months: 1
    period:
      gte: 1895-01
      lte: 2013-07
  variables:
    - id: ppt
      class: Precipitation
      name: Monthly precipitation
    - id: tmax
      class: Temperature
      name: Monthly maximum temperature
    - id: tmin
      class: Temperature
      name: Monthly minimum temperature

- id: srtm
  title: SRTM 90m Digital Elevation Model V4.1
  timespan:
    resolution:
      years: 1
    period:
      gte: '2009'
      lte: '2009'
  variables:
    - id: srtm_elevation
      class: Elevation
      name: Elevation
      units: m
