[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skope-release"
version = "0.1.0"
description = "Build SKOPE dataset releases: COGs, STAC, overviews, and release manifests."
requires-python = ">=3.12"
dependencies = [
    "jsonschema",
    "netCDF4",  # prepare scripts read NetCDF sources (META-013)
    "numpy<3",
    "packaging==26.3",  # pinned SPDX license list
    "pydantic>=2.9,<3",
    "PyYAML",
    "referencing",
    "rfc8785",
]

[project.scripts]
skope-release = "skope_release.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skope_release = ["schemas/**/*.json"]
