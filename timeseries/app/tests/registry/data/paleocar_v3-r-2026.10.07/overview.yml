  lineage: "In addition to reconstructions of calendar-year and growing-season precipitation, PaleoCAR v3 differs from v2 in two ways. It uses the detrended and indexed (standardized) series ('ARSTND') available from the ITRDB instead of the 'Standard' chronologies, which left four or fewer chronologies available for 1–102 CE and 418–589 CE. It selects models by minimizing the corrected Akaike information criterion in a stepwise fashion, instead of the predicted residual error sum of squares (PRESS) statistic. For each pixel and year, the model selects the tree-ring chronologies (within a 10-degree buffer of the Four Corners states, from the National Tree Ring Database) that best predict PRISM data for that location, and uses linear regression to estimate the paleoenvironmental variable for that date and location."
  publications:
    - citation: "Bocinsky, R. Kyle, and Timothy A. Kohler. 2014. A 2,000-year reconstruction of the rain-fed maize agricultural niche in the US Southwest. Nature Communications 5:5618."
      doi: "10.1038/ncomms6618"
    - citation: "Bocinsky, R. Kyle, Johnathan Rush, Keith W. Kintigh, and Timothy A. Kohler. 2016. Exploration and exploitation in the macrohistory of the pre-Hispanic Pueblo Southwest. Science Advances 2(4):e1501532."
      doi: "10.1126/sciadv.1501532"
  uncertainty:
    summary: "There are two primary sources of uncertainty in PaleoCAR reconstructions. The first is that the PaleoCAR algorithm attempts to select the most relevant three ring chronologies for reconstructing a particular variable of interest at a particular time. This selection process, minimizing the corrected Akaike information criterion in a stepwise fashion, can lead to different sets of chronologies being selected for adjacent pixels in a gridded reconstruction. Discrepancies between selected chronologies can manifest as spatiotemporal \"artifacts\", or discontinuities (Bocinsky and Kohler 2014:8). These are amplified by the chained mean-variance matching technique (Bocinsky et al. 2016:10). Additional uncertainty is associated with the lack of fit in the regression models; fit decreases as fewer tree ring chronologies are available."
    methodology_href: null
